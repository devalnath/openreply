name: Harden dependencies


on:
  workflow_dispatch:
  push:
    branches: [security-hardening]
    paths: [.github/workflows/security-hardening.yml]


permissions:
  contents: write


concurrency:
  group: security-hardening
  cancel-in-progress: false


jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update supported dependency releases
        run: |
          npm pkg set 'overrides.next-auth.nodemailer=$nodemailer' 'overrides.@auth/core.nodemailer=$nodemailer'
          npm install next@16 react@19 react-dom@19 next-auth@beta @auth/prisma-adapter@latest @prisma/adapter-pg@7 @prisma/client@7 nodemailer@latest zod@4
          npm install --save-dev prisma@7 eslint-config-next@16 @types/nodemailer@latest
      - name: Apply compatible transitive security fixes
        continue-on-error: true
        run: npm audit fix
      - name: Reject high and critical runtime vulnerabilities
        run: npm audit --omit=dev --audit-level=high
      - name: Generate Prisma client
        run: npm run db:generate
